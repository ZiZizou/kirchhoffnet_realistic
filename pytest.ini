[pytest]
# One command, whole repo:   python -m pytest -q      (or just: pytest -q)
# tests/ holds the golden numerical baseline; the root test_*.py hold the feature tests.
testpaths = tests test_*.py
python_files = test_*.py
pythonpath = . tests/golden
# slow = the CPU learning validation (tests/test_hw_learning.py, ~5 min on 48 cores
# when spread over processes): excluded by default, run it with  -m slow
addopts = -p no:cacheprovider -m "not slow"
markers =
    slow: long CPU training validation (Phase 3b 2.4(c)); run with -m slow
filterwarnings =
    ignore::DeprecationWarning
